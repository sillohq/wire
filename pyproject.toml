[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sillo-wire"
version = "0.1.0"
description = "Rooms, presence and fan-out for Sillo WebSockets — bounded queues, replayable backlog, no global state."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
authors = [
    {name = "Chidebele Dunamis", email = "techwithdunamix@gmail.com"}
]
keywords = ["sillo", "websocket", "realtime", "pubsub", "presence", "broadcast", "asgi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
# Only the socket surface is used — WebSocketContext and the logger. No ORM,
# no cache, no extras.
dependencies = ["sillo-framework>=0.3"]

[project.urls]
Homepage = "https://sillo.build"
Documentation = "https://docs.sillo.build/packages/wire/"
Source = "https://github.com/sillohq/wire"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]

# The parent `sillo/` package directory belongs to sillo-framework; this wheel
# ships only the subpackage into it, which is what makes `from sillo.wire
# import Hub` work without an import hook and without a namespace package.
[tool.hatch.build.targets.wheel]
only-include = ["sillo/wire"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["sillo/wire"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "if typing.TYPE_CHECKING:",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
# `sillo/` has no __init__.py in this checkout — it belongs to sillo-framework,
# and this repo ships only the subpackage into it.
explicit_package_bases = true
namespace_packages = true
