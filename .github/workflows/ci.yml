name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install sillo-framework
          pip install pytest pytest-asyncio pytest-cov ruff mypy

      - name: Lint
        run: ruff check sillo tests

      - name: Types
        run: mypy --explicit-package-bases sillo/wire

      # `tests/conftest.py` appends this checkout to `sillo.__path__`, which is
      # what the wheel does at install time by shipping into the same
      # directory. There is no editable-install equivalent for that layout.
      - name: Test
        run: pytest --cov --cov-report=term-missing

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      # The wheel must contain sillo/wire and nothing above it — the parent
      # package belongs to sillo-framework.
      - name: Check the wheel ships only the subpackage
        run: |
          python - <<'PY'
          import zipfile, glob
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          modules = [n for n in names if not n.startswith("sillo_wire-")]
          assert all(n.startswith("sillo/wire/") for n in modules), modules
          assert "sillo/__init__.py" not in names, "must not ship the parent package"
          print("\n".join(modules))
          PY
